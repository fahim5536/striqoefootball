openapi: 3.1.0
info:
  title: Striqo Football Platform API
  description: API Documentation for the Striqo Football Platform. This API provides programmatic access to users, teams, tournaments, matches, and more.
  version: 1.0.0
  contact:
    name: API Support
    email: dev@striqo.com
servers:
  - url: /
    description: Current Environment
  - url: /api/v1
    description: V1 APIs
tags:
  - name: Authentication
    description: User registration, login, and auth management
  - name: Users
    description: User management and public profiles
  - name: Teams
    description: Team creation, membership, and invites
  - name: Tournaments
    description: Tournament management, brackets, and status
  - name: Matches
    description: Match scheduling, scores, and status
  - name: Leaderboards
    description: Global rankings and leaderboards
  - name: Notifications
    description: In-app notifications and inbox
  - name: AI
    description: AI features like OCR and Match Analysis
  - name: Uploads
    description: Media and image uploads
  - name: Admin
    description: Administrative and moderation tools
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
        error:
          type: string
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Invalid request parameters"
        meta:
          type: object
          properties:
            timestamp:
              type: string
              format: date-time
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [USER, MODERATOR, ADMIN, SUPER_ADMIN] }
        status: { type: string, enum: [ACTIVE, SUSPENDED, BANNED] }
        createdAt: { type: string, format: date-time }
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        tag: { type: string }
        logoUrl: { type: string, nullable: true }
        isVerified: { type: boolean }
    Tournament:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string }
        startDate: { type: string, format: date-time }
    Match:
      type: object
      properties:
        id: { type: string, format: uuid }
        tournamentId: { type: string, nullable: true }
        format: { type: string }
        status: { type: string }
security:
  - bearerAuth: []
paths:
  /api/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, minLength: 3 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: Validation error or username/email taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          user: { $ref: '#/components/schemas/User' }
        '401':
          description: Invalid credentials
  /api/auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
  /api/teams:
    post:
      tags: [Teams]
      summary: Create a new team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, tag]
              properties:
                name: { type: string }
                tag: { type: string }
                description: { type: string }
                logoUrl: { type: string }
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/teams/my:
    get:
      tags: [Teams]
      summary: Get teams the user belongs to
      responses:
        '200':
          description: List of user's teams
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Team'
  /api/tournaments:
    get:
      tags: [Tournaments]
      summary: List tournaments
      security: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Search term
        - in: query
          name: status
          schema: { type: string }
          description: Filter by status
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: A list of tournaments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Tournament'
  /api/matches/{id}:
    get:
      tags: [Matches]
      summary: Get match details
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Match details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/leaderboards/global:
    get:
      tags: [Leaderboards]
      summary: Get global player rankings
      security: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Global leaderboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/ai/analyze-match:
    post:
      tags: [AI]
      summary: Analyze a match using AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId, data]
              properties:
                matchId: { type: string }
                data: { type: string }
      responses:
        '200':
          description: AI analysis results
  /api/media/upload:
    post:
      tags: [Uploads]
      summary: Upload a media file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                context:
                  type: string
      responses:
        '201':
          description: File uploaded
  /api/v1/search/global:
    get:
      tags: [Users, Teams, Tournaments]
      summary: Global search across multiple entities
      security: []
      parameters:
        - in: query
          name: q
          required: true
          schema: { type: string, minLength: 2 }
        - in: query
          name: entity
          schema: { type: string, enum: [user, team, tournament, all] }
      responses:
        '200':
          description: Search results
